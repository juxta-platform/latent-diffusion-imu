# Pure trajectory-conditioned generation from Gaussian noise
model:
  target: ldm.models.diffusion.ddpm_1d.LatentDiffusion1D
  params:
    timesteps: 1000
    beta_schedule: linear
    linear_start: 1.0e-4
    linear_end: 2.0e-2
    loss_type: l2
    scale_factor: 1.0
    scale_by_std: false
    use_ema: true

    first_stage_config:
      target: ldm.models.autoencoder_1d.AutoencoderKL1D
      params:
        embed_dim: 8
        kl_weight: 1.0e-6
        ddconfig:
          ch: 64
          in_channels: 6
          out_channels: 6
          z_channels: 8
          ch_mult: [1, 2, 4]
          num_res_blocks: 2
          dropout: 0.0
          downsample_factors: [2, 2, 5]
          upsample_factors: [5, 2, 2]
          double_z: true

    first_stage_ckpt: ???

    unet_config:
      target: ldm.modules.diffusionmodules.unet_1d.UNetModel1D
      params:
        in_channels: 11
        out_channels: 8
        model_channels: 128
        channel_mult: [1, 2, 4]
        num_res_blocks: 2
        attention_levels: [1, 2]
        dropout: 0.0
        num_heads: 8

sampling:
  ddim_steps: 50
  ddim_eta: 0.0
  batch_size: 4
  seed: 42
